<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07070c" />
    <meta
      name="description"
      content="A tiny browser maze game. You are a wizard who can see only the tile you stand on. Find the way out."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wandering Wizard</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css?v=5" />
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <h1 class="hud__title">Wandering Wizard</h1>
        <div class="hud__status">
          <p class="hud__timer" id="timer">0:00</p>
          <p class="hud__meta" id="map-label">Map &mdash;</p>
        </div>
      </header>

      <main class="view">
        <!--
          The maze is drawn at 100 user units per tile. render.js sets the
          viewBox so that a little over one tile is on screen at any time, and
          translates the world group to keep the wizard's tile centred.
        -->
        <svg
          class="stage"
          id="stage"
          preserveAspectRatio="xMidYMid meet"
          role="img"
          aria-labelledby="stage-title"
        >
          <title id="stage-title">The tile the wizard is standing on</title>
          <defs id="stage-defs"></defs>
          <g id="world">
            <g id="tiles"></g>
          </g>
          <!-- The wizard never moves on screen: the world slides beneath. -->
          <g id="wizard"></g>
        </svg>
      </main>

      <nav class="controls" id="controls" aria-label="Movement">
        <button class="pad pad--up" type="button" data-move="up" aria-label="Move up">
          <span class="pad__arrow" aria-hidden="true"></span>
          <span class="pad__label">Up</span>
        </button>
        <button class="pad pad--left" type="button" data-move="left" aria-label="Move left">
          <span class="pad__arrow" aria-hidden="true"></span>
          <span class="pad__label">Left</span>
        </button>
        <span class="pad__rune" aria-hidden="true"></span>
        <button class="pad pad--right" type="button" data-move="right" aria-label="Move right">
          <span class="pad__arrow" aria-hidden="true"></span>
          <span class="pad__label">Right</span>
        </button>
        <button class="pad pad--down" type="button" data-move="down" aria-label="Move down">
          <span class="pad__arrow" aria-hidden="true"></span>
          <span class="pad__label">Down</span>
        </button>
      </nav>
    </div>

    <div class="overlay" id="win-overlay" hidden>
      <div class="overlay__card" id="win-card" role="alertdialog" aria-labelledby="win-title">
        <p class="overlay__spark" aria-hidden="true">&#10022;</p>
        <h2 class="overlay__title" id="win-title">Ye hath escaped!</h2>
        <p class="overlay__time">
          <span class="overlay__time-label">Thy time on map <span id="win-letter">&mdash;</span></span>
          <span class="overlay__time-value" id="win-time">0:00</span>
        </p>
        <button class="button" type="button" id="share">Share thy time</button>
        <button class="button button--ghost" type="button" id="see-map">See map</button>
        <p class="overlay__note" id="share-note" role="status" aria-live="polite"></p>
        <!-- Shown only if the clipboard is unavailable, so there is always a
             way to get the message out. -->
        <input
          class="overlay__field"
          id="share-field"
          type="text"
          readonly
          hidden
          aria-label="Message to copy"
        />
        <p class="overlay__footer" id="next-map">A new map each day.</p>
      </div>

      <div
        class="overlay__card overlay__card--map"
        id="map-card"
        role="dialog"
        aria-labelledby="map-title"
        hidden
      >
        <h2 class="overlay__title overlay__title--sub" id="map-title">
          Map <span id="map-letter">&mdash;</span>, entire
        </h2>
        <div class="map-frame">
          <svg class="map-svg" id="map-svg" viewBox="0 0 700 700" role="img"
               aria-label="The full maze, revealed"></svg>
        </div>
        <ul class="map-legend">
          <li><span class="swatch swatch--start"></span>Start</li>
          <li id="legend-portals"><span class="swatch swatch--portal"></span>Portals</li>
          <li><span class="swatch swatch--exit"></span>Exit</li>
        </ul>
        <button class="button button--ghost" type="button" id="map-back">Back</button>
      </div>
    </div>

    <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>

    <!--
      GitHub Pages caches each file independently for ten minutes, so a
      returning player can otherwise end up with a fresh index.html and a
      stale script. Bump ?v= whenever the CSS or JS changes.
    -->
    <script src="js/mazes.js?v=5"></script>
    <script src="js/render.js?v=5"></script>
    <script src="js/game.js?v=5"></script>
  </body>
</html>
